name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Hard timeout — if we're not done in 10 min, something's stuck
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      # Build the static web output ourselves. This avoids `vercel build`
      # which has been hanging on Metro-related things in CI.
      - name: Build web bundle
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}

      # Fail early with a clear message instead of Vercel's "invalid token".
      - name: Check Vercel secrets
        run: |
          missing=""
          [ -z "$T" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$O" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$P" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
          O: ${{ secrets.VERCEL_ORG_ID }}
          P: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Vercel CLI automatically uses VERCEL_ORG_ID and VERCEL_PROJECT_ID
      # env vars to know which project to deploy to — no .vercel/ folder
      # needed, no risk of creating a new "dist" project.
      - name: Deploy to Vercel
        working-directory: ./dist
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
